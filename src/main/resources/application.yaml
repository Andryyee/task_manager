spring:
  application:
    name: task_manager
  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: create-drop
  datasource:
    url: jdbc:h2:mem:taskmanagerdb
    username: sa
    password:
  h2:
    console:
      enabled: true
server:
  port: 8080
